services:
  dev:
    build: .
    working_dir: /app
    command: npm run dev
    ports:
      # Только локально, наружу не торчит. Внутри vite слушает 0.0.0.0:3000.
      - "127.0.0.1:3000:3000"
    volumes:
      # Исходники с хоста...
      - .:/app
      # ...но node_modules держим в volume, чтобы хост оставался чистым.
      - node_modules:/app/node_modules

volumes:
  node_modules:
