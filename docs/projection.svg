<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .story  { fill: #4f8cff; fill-opacity: 0.30; stroke: #4f8cff; stroke-width: 2; }
    .code    { fill: #2ecc71; fill-opacity: 0.08; stroke: #2ecc71; stroke-width: 2.5; }
    .codedot { fill: #2ecc71; fill-opacity: 0.28; stroke: #2ecc71; stroke-width: 1.5; }
    .title   { fill: #222; font-size: 22px; font-weight: 700; text-anchor: middle; }
    .lbl     { fill: #444; font-size: 13px; text-anchor: middle; }
    .arrow   { fill: #888; font-size: 16px; font-weight: 600; text-anchor: middle; }
  </style>

  <!-- ===== STORY: пересекающиеся окружности ===== -->
  <text x="200" y="40" class="title">Story</text>
  <circle class="story" cx="170" cy="150" r="62" />
  <circle class="story" cx="240" cy="155" r="58" />
  <circle class="story" cx="200" cy="220" r="60" />
  <circle class="story" cx="135" cy="225" r="50" />
  <circle class="story" cx="265" cy="220" r="48" />
  <text x="200" y="320" class="lbl">каждая окружность — история</text>
  <text x="200" y="340" class="lbl">(маленький смысл)</text>

  <!-- ===== ПРОЕКЦИЯ: стрелка ===== -->
  <defs>
    <marker id="head" orient="auto" markerWidth="10" markerHeight="10" refX="7" refY="3">
      <path d="M0,0 L7,3 L0,6 Z" fill="#888" />
    </marker>
  </defs>
  <line x1="350" y1="190" x2="500" y2="190" stroke="#888" stroke-width="2.5" marker-end="url(#head)" />
  <text x="425" y="178" class="arrow">Проекция</text>

  <!-- ===== CODE: большая окружность = полное покрытие ===== -->
  <text x="660" y="40" class="title">Code</text>
  <circle class="code" cx="660" cy="190" r="130" />
  <!-- те же истории, спроецированные внутрь кода -->
  <circle class="codedot" cx="630" cy="150" r="48" />
  <circle class="codedot" cx="700" cy="160" r="44" />
  <circle class="codedot" cx="650" cy="220" r="46" />
  <circle class="codedot" cx="605" cy="210" r="34" />
  <circle class="codedot" cx="710" cy="225" r="36" />
  <text x="660" y="350" class="lbl">большая окружность — код</text>
  <text x="660" y="370" class="lbl">(в идеале покрыт полностью)</text>
</svg>
